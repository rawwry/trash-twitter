{% from "partials/icons.html" import icon %}
{# Schnell-Loeschen im Archiv (0.23): ohne Rueckfrage - die Karte verschwindet, 8 Sekunden "Rueckgaengig". #}
<button class="q-del" type="button" title="Löschen" aria-label="Posting Nr. {{ archive_no(post) }} löschen"
        data-defer-delete="{{ url('/posts/' ~ post.id ~ '/delete') }}" data-post-id="{{ post.id }}"
        data-label="Posting von {{ post.author_name }}">{{ icon('trash', 16) }}</button>
